<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración de tienda</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1 id="storeName">Mi tienda</h1>
      <div id="subscriptionSummary" class="subscription-summary" hidden></div>
      <nav id="menu" aria-label="Secciones de la tienda"></nav>
      <button id="logoutBtn" class="ghost">Cerrar sesión</button>
    </aside>
    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="viewTitle">Inicio</h2>
          <p id="viewSubtitle">Resumen general del negocio</p>
        </div>
      </header>
      <div id="subscriptionBanner" class="subscription-banner" hidden></div>
      <div id="message" class="message" aria-live="polite"></div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="/js/customer-credit-ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
