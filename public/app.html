<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16883a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/administrau-icon.png" type="image/png">
  <title>Administrau</title>
  <script src="/js/store-theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css?v=20261005-1">
</head>
<body>
  <div class="layout" id="appLayout">
    <aside class="sidebar" id="appSidebar" aria-label="Navegación principal">
      <div class="sidebar-heading">
        <div class="store-mark" aria-hidden="true"><img src="/assets/administrau-icon.png" alt=""></div>
        <h1 id="storeName">Mi tienda</h1>
      </div>
      <nav id="menu" aria-label="Secciones de la tienda"></nav>
      <details class="account-menu sidebar-account-menu" id="accountMenu">
        <summary class="icon-button" aria-label="Abrir configuración"><span aria-hidden="true">⚙</span></summary>
        <div class="account-menu-panel">
          <p class="account-menu-title">Cuenta y configuración</p>
          <p id="subscriptionSummary" class="subscription-summary" hidden></p>
          <button id="settingsStoreButton" type="button" data-settings-view="configuracion">Configuración de la tienda</button>
          <button id="settingsAuditButton" type="button" data-settings-view="auditoria">Auditoría</button>
          <a href="/suscripcion.html">Mi plan y facturación</a>
          <button id="helpBtn" type="button">Centro de ayuda</button>
          <button type="button" data-pwa-install hidden>Instalar aplicación</button>
          <button type="button" data-toggle-theme aria-pressed="false">Modo oscuro</button>
          <button id="logoutBtn" type="button" class="account-logout">Cerrar sesión</button>
        </div>
      </details>
    </aside>
    <button id="navigationToggle" class="icon-button navigation-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" aria-label="Ocultar navegación">☰</button>
    <button id="sidebarScrim" class="sidebar-scrim" type="button" aria-label="Cerrar navegación" hidden></button>
    <main class="content">
      <header class="topbar">
        <div class="topbar-heading">
          <div>
            <h2 id="viewTitle">Inicio</h2>
            <p id="viewSubtitle">Resumen general del negocio</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="helpBackTopbar" type="button" class="secondary" hidden>← Volver</button>
          <button id="settingsBackTopbar" type="button" class="secondary" hidden>← Volver al panel</button>
          <nav class="quick-actions" id="quickActions" aria-label="Accesos rápidos">
            <button type="button" data-quick-view="ventas">Vender</button>
            <button type="button" class="secondary" data-quick-view="compras">Registrar compra</button>
            <button type="button" class="secondary" data-quick-view="pagos">Fiados</button>
          </nav>
        </div>
      </header>
      <div id="viewProgress" class="view-progress" role="progressbar" aria-label="Cargando contenido" hidden><span></span></div>
      <div id="subscriptionBanner" class="subscription-banner" hidden></div>
      <div id="message" class="message" aria-live="polite"></div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="serverWakeNotice" class="server-wake-notice" role="status" aria-live="polite" hidden>
    <span class="server-wake-notice-icon" aria-hidden="true">↻</span>
    <div><strong>Reconectando con la tienda</strong><p>El servidor estaba en reposo. Puede tardar hasta un minuto; no recargues la página.</p></div>
  </div>
  <div id="modalRoot"></div>
  <script src="/js/http-security.js"></script>
  <script src="/js/phone-country-codes.js"></script>
  <script src="/js/customer-credit-ui.js"></script>
  <script src="/js/compensation-ui.js"></script>
  <script src="/js/administrative-audit-ui.js"></script>
  <script src="/js/inventory-adjustment-ui.js"></script>
  <script src="/js/ui-patterns.js"></script>
  <script src="/js/store-configuration-ui.js"></script>
  <script src="/js/product-analytics.js"></script>
  <script src="/js/welcome-guide.js"></script>
  <script src="/js/help-center.js"></script>
  <script src="/js/pwa-install.js?v=20261005-1"></script>
  <script src="/js/app.js?v=20261005-1"></script>
</body>
</html>
